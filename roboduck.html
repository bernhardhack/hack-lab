<script>
Object.assign(I18N.en, {
  pEyebrow:"Mission 04 · to be developed", pTitle:"Roboduck",
  pWhy:"A two-legged LEGO duck that waddles, nods and pecks — inspired by Microduck, a small walking robot duck from Pollen Robotics. Parked until the robo dog walks. This page holds what we found out so far, so nothing is lost.",
  heroCap:"Two legs, wide feet, a body that leans over one foot before the other one lifts. That lean is the whole trick.",
  goalLabel:"The goal", goalBody:"A duck that walks on two legs without falling over and reacts to something in the room — built twice, once in Nairobi, once in Vienna.",
  stateLabel:"Where we are", stateBody:"Not built. Research and a computer simulation are done. Mission 03, the robo dog, comes first.",
  soFarHead:"What we have so far",

  tdBody:"Pollen publishes the full computer model of Microduck. It has 15 motors: five in each leg, four in the neck and head, one in the beak. It is 25 cm tall and weighs 740 g, and over a third of that is the head, which it swings around to keep its balance. A small brain trained by trial and error moves all the motors 50 times a second. We have four LEGO motors, so copying it is out. Borrowing its ideas is not.",
  simLabel:"Step 2 · Test it on the computer", simTitle:"A simulated LEGO duck",

  simFail:"Two leg ideas failed on the computer. In both, the duck rolled both feet onto their edges instead of lifting one foot, because that costs less energy. Good to find out before building them.",
  simWork:"One idea works: first lean the whole body sideways over one foot while both feet are still down, then lift the other foot with a crank. About 1 metre per minute, it never fell in six hard tests, and it can turn on the spot.",
  planHead:"The plan that worked on the computer",
  plan1:"A · large motor: left leg on a crank. The foot pushes flat along the floor, then lifts and swings forward.",
  plan2:"B · large motor: right leg, half a turn behind the left.",
  plan3:"C · medium motor, geared down 1:5: the sideways lean. Both legs tilt together and the feet stay flat.",
  plan4:"D · medium motor: the neck nods with each step, and could open the beak.",
  plan5:"Distance sensor as eyes, colour sensor in the beak, and the hub's tilt sensor to keep it walking straight.",
  planSize:"Sizes the computer liked: legs 4 studs either side of the middle, 72 mm from hip to ankle, feet 10 × 6 studs. Each crank should push the foot 56 mm along the floor and lift it 14 mm.",
  openHead:"Open decisions",
  jacobRole:"Jacob · Chief Engineer",
  jacobBody:"The computer only says which path the foot should draw. Which LEGO linkage draws it, and how to make the lean stiff enough, is your call — and so is throwing the plan out if the real bricks say otherwise.",
  emmaRole:"Emma · Chief Mission Designer",
  emmaBody:"What the duck does once it walks — pecking at a colour, following someone, a dance — what counts as “it worked”, and its name.",
  knowHead:"Worth knowing before you start",
  know1:"Two legs are much harder than four. The robo dog teaches the crank-leg tricks this duck needs, so it really is the right order.",
  know2:"The swinging foot only clears the floor by about 3 mm. Smooth floors are fine, carpet is a problem.",
  know3:"The lean motor works hardest. Stiff gears and no wobble in that part matter more than anything else.",
  know4:"The weights in the simulation are guesses. Weighing the real parts on a kitchen scale makes the computer's answers more trustworthy.",
  logHead:"Build log",
  logNote:"Nothing built yet. 22 Oct 2026: Microduck research and the first simulation done.",
  resHead:"Ground support resources", resNote:"For reference. None of these is the plan.",
  res1:"The real Microduck: 15 motors, a camera, and it learns its moves in a simulator before trying them for real.",
  res2:"Pollen's open training code and computer model. Where our measurements of Microduck come from.",
  res3Title:"LEGO motor measurements",
  res3:"How strong and how fast each LEGO motor really is. The simulation uses these numbers.",
  res4Tag:"In the project folder", res4Title:"The simulator",
  res4:"Python files that build the duck, walk it and try different sizes (roboduck/sim). Change a number, run it again, see if it still walks."
});
Object.assign(I18N.de, {

  simLabel:"Schritt 2 · Am Computer testen", simTitle:"Eine simulierte LEGO-Ente",
  simBody:"Bevor wir etwas bauen, haben wir die Ente in MuJoCo gebaut, demselben Physiksimulator, den Pollen verwendet: der Hub als Körper, echte LEGO-Motorstärken, ein bisschen Spiel in den Zahnrädern. Dann haben wir 361 verschiedene Enten auf rutschigen Böden, griffigen Böden und mit schwereren Körpern ausprobiert.",
  simFail:"Zwei Bein-Ideen sind am Computer gescheitert. Bei beiden hat die Ente beide Füße auf die Kante gerollt, statt einen Fuß zu heben, weil das weniger Energie kostet. Gut, das vor dem Bauen herauszufinden.",

  planHead:"Der Plan, der am Computer funktioniert hat",

  know2:"Der schwingende Fuß kommt nur etwa 3 mm über den Boden. Glatte Böden sind kein Problem, Teppich schon.",
  know3:"Der Lehn-Motor arbeitet am härtesten. Steife Zahnräder und kein Spiel in diesem Teil sind wichtiger als alles andere.",
  know4:"Die Gewichte in der Simulation sind geschätzt. Die echten Teile auf der Küchenwaage zu wiegen macht die Antworten des Computers verlässlicher.",
  logHead:"Baulogbuch",
  logNote:"Noch nichts gebaut. 22. Okt. 2026: Microduck-Recherche und erste Simulation erledigt.",
  resHead:"Ground-Support-Ressourcen", resNote:"Zum Nachschauen. Keine davon ist der Plan.",
  res1:"Die echte Microduck: 15 Motoren, eine Kamera, und sie lernt ihre Bewegungen in einem Simulator, bevor sie sie echt ausprobiert.",
  res2:"Pollens offener Trainingscode und das Computermodell. Daher kommen unsere Messungen von Microduck.",
  res3Title:"LEGO-Motor-Messungen",
  res3:"Wie stark und wie schnell jeder LEGO-Motor wirklich ist. Die Simulation verwendet diese Zahlen.",
  res4Tag:"Im Projektordner", res4Title:"Der Simulator",
  res4:"Python-Dateien, die die Ente bauen, laufen lassen und verschiedene Größen ausprobieren (roboduck/sim). Eine Zahl ändern, nochmal laufen lassen, schauen, ob sie noch läuft."
});

  pEyebrow:"Missione 04 · da sviluppare", pTitle:"Roboduck",
