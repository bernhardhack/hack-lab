  <style>
    .tts-word { border-radius: 3px; }
    .tts-word.on { background: #34d399; color: #05221a; }
    .readable.tts-active { outline: 2px solid #34d399; outline-offset: 4px; }
    .speak-btn {
      position: absolute; top: 10px; right: 10px;
      width: 30px; height: 30px; border-radius: 8px;
      background: #0f172a; border: 1px solid #334155; color: #94a3b8;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; line-height: 1; cursor: pointer; z-index: 5;
    }
    .speak-btn:hover { color: #34d399; border-color: #34d399; }
    .speak-btn.playing { color: #34d399; border-color: #34d399; }

    /* --- Cream theme + reading aids --------------------------------------
       Background is cream, not white: the British Dyslexia Association
       advises against white, which can appear too dazzling.               */
    body { background: #F6F1E6; }
    .tts-word.on { background: #FDE68A !important; color: #1F2933 !important; }
    .readable.tts-active { outline-color: #047857 !important; }
    .speak-btn { background:#FFFDF7 !important; border-color:#CFC4AC !important; color:#46545F !important; }
    .speak-btn:hover, .speak-btn.playing { color:#047857 !important; border-color:#047857 !important; }

    /* Easy-read: Verdana ships on iPadOS and tests well in the research.
       Spacing values follow the BDA style guide.                          */
    html[data-read="easy"] body,
    html[data-read="easy"] body * { font-family: Verdana, Geneva, sans-serif !important; }
    html[data-read="easy"] p,
    html[data-read="easy"] li,
    html[data-read="easy"] h1,
    html[data-read="easy"] h2,
    html[data-read="easy"] h3 { letter-spacing: .06em; word-spacing: .16em; }
    html[data-read="easy"] p, html[data-read="easy"] li { line-height: 1.9 !important; }

    p, li { text-align: left; }
    .hero { width:100%; border-radius:14px; border:1px solid #DDD4C0; display:block; }
  </style>
  <style id="a11y">
    /* Root scale: everything in Tailwind is rem-based, so this lifts the whole
       page at once. Children can override it with the A / A+ / A++ control. */
    html { font-size: 18px; -webkit-text-size-adjust: 100%; }
    html[data-size="l"]  { font-size: 20.5px; }
    html[data-size="xl"] { font-size: 23px; }

    /* Line height and measure: long lines are the main barrier to line-tracking */
    p, li { line-height: 1.7 !important; }
    p, li { max-width: 68ch; }
    h1, h2, h3 { line-height: 1.3 !important; }

    /* 44px minimum touch targets (Apple HIG) */
    .lang-btn, #readAll, #readStop, .size-btn {

    }
    .readable { padding-top: 3.5rem !important; }

    /* Links that are cards need a touch affordance, not a hover one */
    a.readable:active, a.card-link:active { border-color: #34d399 !important; }
  </style>
</head>

(function () {
  var ON  = ["bg-[#EDE6D6]", "text-[#047857]", "border-[#047857]"];
  var OFF = ["text-[#46545F]", "border-[#CFC4AC]"];

  function apply(lang) {
    var d = I18N[lang] || I18N.en;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var v = d[el.getAttribute("data-i18n")];
      if (v) el.textContent = v;
    });
    document.querySelectorAll(".lang-btn").forEach(function (b) {
      var active = b.getAttribute("data-lang") === lang;
      ON.forEach(function (c) { b.classList.toggle(c, active); });
      OFF.forEach(function (c) { b.classList.toggle(c, !active); });
    });
    try { localStorage.setItem("hl-lang", lang); } catch (e) {}
  }

  document.querySelectorAll(".lang-btn").forEach(function (b) {
    b.addEventListener("click", function () { apply(b.getAttribute("data-lang")); });
  });

  var saved = null;
  try { saved = localStorage.getItem("hl-lang"); } catch (e) {}
  var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  apply(saved || (I18N[nav] ? nav : "en"));
})();

<script>
/* ---------------- Read-aloud (Web Speech API) ---------------------------
   Word-level highlighting needs the SpeechSynthesis `boundary` event, which
   iOS Safari does not fire. Where it is missing we highlight the whole block
   instead, so the audio still works everywhere.                          */
(function () {
  var synth = window.speechSynthesis;
  var bar = document.querySelector("#readAll") && document.querySelector("#readAll").parentElement;

  if (!synth) {
    if (bar) bar.style.display = "none";
    return;
  }

  var LANGMAP = { en: "en-GB", de: "de-DE", it: "it-IT" };
  var queue = [], qi = 0, current = null, wordSpans = [], sawBoundary = false;

  function docLang() { return document.documentElement.lang || "en"; }

  function pickVoice(tag) {
    var vs = synth.getVoices() || [];
    var two = tag.slice(0, 2);
    return vs.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(two) === 0; })[0] || null;
  }

  function clearHighlight() {
    if (current) current.classList.remove("tts-active");
    wordSpans.forEach(function (s) { s.classList.remove("on"); });
    document.querySelectorAll(".speak-btn.playing").forEach(function (b) {
      b.classList.remove("playing"); b.textContent = "\u25B6";
    });
  }

  function unwrap(el) {
    el.querySelectorAll("[data-tts-src]").forEach(function (n) {
      n.textContent = n.getAttribute("data-tts-src");
      n.removeAttribute("data-tts-src");
    });
  }

  /* Wrap each word of every text-bearing child so it can be highlighted. */
  function wrapWords(el) {
    var spans = [], offset = 0;
    el.querySelectorAll("h2,h3,p,span,div").forEach(function (n) {
      if (n.children.length) return;
      var t = n.textContent;
      if (!t || !t.trim()) return;
      n.setAttribute("data-tts-src", t);
      var html = "", re = /\S+\s*/g, m;
      while ((m = re.exec(t)) !== null) {
        var w = m[0];
        html += '<span class="tts-word" data-s="' + (offset + m.index) + '">' +
                w.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>";
      }
      n.innerHTML = html;
      offset += t.length + 1;
      Array.prototype.push.apply(spans, n.querySelectorAll(".tts-word"));
    });
    return spans;
  }

  function textOf(el) {
    var out = [];
    el.querySelectorAll("h2,h3,p,span,div").forEach(function (n) {
      if (n.children.length) return;
      var t = n.textContent && n.textContent.trim();
      if (t) out.push(t);
    });
    return out.join(". ");
  }

  function speakBlock(el, btn, onDone) {
    var tag = LANGMAP[docLang()] || "en-GB";
    var text = textOf(el);
    if (!text) { onDone && onDone(); return; }

    current = el;
    el.classList.add("tts-active");
    wordSpans = wrapWords(el);
    sawBoundary = false;

    var u = new SpeechSynthesisUtterance(text);
    u.lang = tag;
    var v = pickVoice(tag); if (v) u.voice = v;
    u.rate = document.getElementById("readSlow").checked ? 0.72 : 0.95;

    u.onboundary = function (e) {
      if (e.name && e.name !== "word") return;
      sawBoundary = true;
      var i = e.charIndex || 0, best = null;
      for (var k = 0; k < wordSpans.length; k++) {
        if (+wordSpans[k].getAttribute("data-s") <= i) best = wordSpans[k]; else break;
      }
      wordSpans.forEach(function (s) { s.classList.remove("on"); });
      if (best) best.classList.add("on");
    };

    u.onend = function () {
      unwrap(el);
      el.classList.remove("tts-active");
      if (btn) { btn.classList.remove("playing"); btn.textContent = "\u25B6"; }
      onDone && onDone();
    };
    u.onerror = u.onend;

    if (btn) { btn.classList.add("playing"); btn.textContent = "\u25A0"; }
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    synth.speak(u);
  }

  function stopAll() {
    queue = []; qi = 0;
    synth.cancel();
    if (current) unwrap(current);
    clearHighlight();
    current = null;
  }

  function runQueue() {
    if (qi >= queue.length) { current = null; return; }
    var el = queue[qi++];
    speakBlock(el, null, runQueue);
  }

  /* Per-card buttons */
  document.querySelectorAll(".readable").forEach(function (card) {
    var b = document.createElement("button");
    b.className = "speak-btn";
    b.type = "button";
    b.textContent = "\u25B6";
    b.setAttribute("aria-label", "Read aloud");
    b.addEventListener("click", function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      var wasPlaying = b.classList.contains("playing");
      stopAll();
      if (!wasPlaying) speakBlock(card, b, null);
    });
    card.appendChild(b);
  });

  document.getElementById("readAll").addEventListener("click", function () {
    stopAll();
    queue = Array.prototype.slice.call(document.querySelectorAll(".readable-part, .readable"));
    qi = 0;
    runQueue();
  });

  document.getElementById("readStop").addEventListener("click", stopAll);

  /* Language switch or navigation must not leave audio running */
  document.querySelectorAll(".lang-btn").forEach(function (b) {
    b.addEventListener("click", stopAll);
  });
  window.addEventListener("pagehide", stopAll);

  /* Safari populates voices asynchronously */
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = function () { synth.getVoices(); };
})();
</script>

<script>
/* Text size control: children pick, choice persists. */
(function () {
  function set(s) {
    document.documentElement.setAttribute("data-size", s);
    document.querySelectorAll(".size-btn").forEach(function (b) {
      var a = b.getAttribute("data-size") === s;
      b.classList.toggle("border-[#047857]", a);
      b.classList.toggle("text-[#047857]", a);
      b.classList.toggle("border-[#CFC4AC]", !a);
      b.classList.toggle("text-[#33414C]", !a);
    });
    try { localStorage.setItem("hl-size", s); } catch (e) {}
  }
  document.querySelectorAll(".size-btn").forEach(function (b) {
    b.addEventListener("click", function () { set(b.getAttribute("data-size")); });
  });
  var s = null; try { s = localStorage.getItem("hl-size"); } catch (e) {}
  set(s || "m");
})();
</script>

<script>
/* Easy-read toggle: Verdana plus wider letter and word spacing. */
(function () {
  var b = document.getElementById("easyRead");
  if (!b) return;
  function set(on) {
    document.documentElement.setAttribute("data-read", on ? "easy" : "normal");
    b.classList.toggle("border-[#047857]", on);
    b.classList.toggle("text-[#047857]", on);
    b.classList.toggle("border-[#CFC4AC]", !on);
    b.classList.toggle("text-[#33414C]", !on);
    try { localStorage.setItem("hl-read", on ? "easy" : "normal"); } catch (e) {}
  }
  b.addEventListener("click", function () {
    set(document.documentElement.getAttribute("data-read") !== "easy");
  });
  var s = null; try { s = localStorage.getItem("hl-read"); } catch (e) {}
  set(s === "easy");
})();
</script>
</body>
