<!DOCTYPE html>
<html lang="en" data-size="m" data-read="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACK-LAB.SPACE</title>
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>
<div class="wrap stack">

  <header class="masthead">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div class="readable-part">
        <div class="row" style="gap:.8rem;align-items:center">
          <div class="wordmark" data-noread>HACK-LAB<span>.SPACE</span></div>
          <div class="lang-set" role="group" data-i18n-label="langLabel" data-noread>
          <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
          <button class="lang-btn" data-lang="de" aria-pressed="false">DE</button>
          <button class="lang-btn" data-lang="it" aria-pressed="false">IT</button>
        </div>
        </div>
        <h1 style="font-size:1.25rem;margin-top:.6rem" data-i18n="tagline"></h1>
        <p class="lede" style="margin-top:.4rem" data-i18n="taglineSub"></p>
      </div>
      <div class="row" style="gap:.4rem;justify-content:flex-end">
        <span class="station" data-i18n="stVienna"></span>
        <span class="station" data-i18n="stNairobi"></span>
      </div>
    </div>
  </header>

  <div class="bar" id="ttsBar">
    <button class="ctl ctl-go" id="readAll" aria-pressed="false" data-i18n="readAloud"></button>
    <details class="prefs">
      <summary data-i18n="prefs"></summary>
      <div class="prefs-body">
        <div class="prefs-group">
          <span data-i18n="sizeLabel"></span>
          <div class="row" role="group" data-i18n-label="sizeLabel">
            <button class="ctl size-btn" data-size="m" aria-pressed="false">A</button>
            <button class="ctl size-btn" data-size="l" aria-pressed="false">A+</button>
            <button class="ctl size-btn" data-size="xl" aria-pressed="false">A++</button>
          </div>
        </div>
        <div class="prefs-group">
          <span data-i18n="easyLabel"></span>
          <div class="row">
            <button class="ctl" id="easyRead" aria-pressed="false" data-i18n="easyRead"></button>
          </div>
        </div>
        <div class="prefs-group">
          <span data-i18n="readingLabel"></span>
          <div class="row">
            <label class="ctl" style="font-weight:600;cursor:pointer">
              <input id="readSlow" type="checkbox" style="width:22px;height:22px">
              <span data-i18n="readSlow"></span>
            </label>
          </div>
        </div>
      </div>
    </details>
  </div>

  <!-- NOW -->
  <section class="stack-s">
    <h2 class="sec-title" data-i18n="nowHead"></h2>
    <div class="linkcard readable">
      <a class="card card--now" href="./plotter.html">
        <div class="eyebrow eyebrow--amber" data-i18n="m0Eyebrow"></div>
        <div class="m0-row" style="margin-top:.3rem">
          <div class="m0-text">
            <h3 data-i18n="m0Title"></h3>
            <p style="margin-top:.6rem" data-i18n="m0Why"></p>
            <p class="small" style="margin-top:.9rem;padding-left:.8rem;border-left:3px solid var(--amber)">
              <span data-i18n="waitOn"></span>
              <span style="color:var(--ink-4)" data-i18n="waitWho"></span>
            </p>
          </div>
          <img src="./plotter-hero.svg" class="hero m0-thumb"
               alt="A LEGO gantry holding a pen above a card, drawing a spiral.">
        </div>
        <div class="cta-row"><span class="cta" data-i18n="m0Open"></span></div>
      </a>
    </div>
  </section>

  <!-- TRAINING -->
  <section class="stack-s">
    <h2 class="sec-title sec-title--violet" data-i18n="trainingHead"></h2>
    <a class="card card-tight card--link readable-part" href="https://bernhardhack.github.io/ki-camp/" target="_blank" rel="noopener">
      <div class="row" style="justify-content:space-between">
        <span class="eyebrow eyebrow--violet" data-i18n="courseBadge"></span>
        <span class="muted" data-i18n="courseOpen"></span>
      </div>
      <div class="course-row" style="margin-top:.3rem">
        <div class="course-text">
          <h3 style="font-size:1rem">KI-Camp</h3>
          <p class="small" style="margin-top:.4rem" data-i18n="courseBody"></p>
        </div>
        <img src="./ki-camp-thumb.jpg" class="course-thumb"
             alt="The KI-Camp start screen, asking who is using it, with a card to pick for each person.">
      </div>
      <p style="margin-top:1rem"><span class="cta cta--violet" data-i18n="courseOpen"></span></p>
    </a>
  </section>

  <!-- BACKLOG -->
  <section class="stack-s">
    <h2 class="sec-title sec-title--quiet" data-i18n="laterHead"></h2>
    <p class="muted" data-i18n="laterNote"></p>
    <div class="grid grid-3">
      <div class="card card-tight card--soon readable-part">
        <div class="row" style="justify-content:space-between;margin-bottom:.4rem">
          <span class="eyebrow" style="color:var(--ink-4);margin:0">Mission 01</span>
          <span class="badge-soon" data-i18n="soon"></span>
        </div>
        <div class="soon-row">
          <div class="soon-art"><svg viewBox="0 0 120 96" fill="none" stroke="currentColor" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="10" y="30" width="100" height="46" rx="16"/>
  <circle cx="36" cy="53" r="9"/>
  <path d="M36 44v-8"/>
  <circle cx="84" cy="46" r="5"/><circle cx="96" cy="58" r="5"/>
  <path d="M60 30V16h14" stroke-dasharray="4 5"/>
</svg></div>
          <div class="soon-text">
            <h3 style="font-size:1rem" data-i18n="m1Title"></h3>
            <p class="small" style="margin-top:.4rem" data-i18n="m1Body"></p>
          </div>
        </div>
      </div>
      <div class="card card-tight card--soon readable-part">
        <div class="row" style="justify-content:space-between;margin-bottom:.4rem">
          <span class="eyebrow" style="color:var(--ink-4);margin:0">Mission 02</span>
          <span class="badge-soon" data-i18n="soon"></span>
        </div>
        <div class="soon-row">
          <div class="soon-art"><svg viewBox="0 0 120 96" fill="none" stroke="currentColor" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="8" y="20" width="52" height="60" rx="6"/>
  <path d="M20 62l12-16 10 12 8-8"/>
  <circle cx="90" cy="42" r="18"/><circle cx="90" cy="42" r="6"/>
  <path d="M90 60v14"/>
  <path d="M78 84h24" stroke-dasharray="3 5"/>
</svg></div>
          <div class="soon-text">
            <h3 style="font-size:1rem" data-i18n="m2Title"></h3>
            <p class="small" style="margin-top:.4rem" data-i18n="m2Body"></p>
          </div>
        </div>
      </div>
      <div class="linkcard readable-part">
        <a class="card card-tight card--soon" href="./robodog.html">
          <div class="row" style="justify-content:space-between;margin-bottom:.4rem">
            <span class="eyebrow" style="color:var(--ink-4);margin:0">Mission 03</span>
            <span class="badge-soon" data-i18n="soon"></span>
          </div>
          <div class="soon-row">
            <div class="soon-art"><svg viewBox="0 0 120 96" fill="none" stroke="currentColor" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="26" y="34" width="62" height="28" rx="8"/>
  <rect x="80" y="20" width="26" height="22" rx="6"/>
  <path d="M92 20v-8"/><circle cx="92" cy="9" r="3"/>
  <path d="M34 62v18M50 62v18M66 62v18M82 62v18"/>
  <path d="M26 44l-12 6 12 6" stroke-dasharray="4 4"/>
</svg></div>
            <div class="soon-text">
              <h3 style="font-size:1rem" data-i18n="m3Title"></h3>
              <p class="small" style="margin-top:.4rem" data-i18n="m3Body"></p>
            </div>
          </div>
        </a>
      </div>
    </div>
  </section>

  <!-- KIT -->
  <section class="stack-s">
    <h2 class="sec-title sec-title--quiet" data-i18n="kitHead"></h2>
    <ul class="row readable-part" style="list-style:none;gap:.5rem">
      <li class="tag"><span data-i18n="kitRobotics"></span>: SPIKE Prime + Expansion</li>
      <li class="tag"><span data-i18n="kitFab"></span>: Bambu Lab</li>
      <li class="tag"><span data-i18n="kitDrawing"></span>: SPIKE pen plotter</li>
      <li class="tag"><span data-i18n="kitAI"></span>: iPad + browser ML</li>
      <li class="tag"><span data-i18n="kitSoftware"></span>: <span data-i18n="kitSoftwareVal"></span></li>
    </ul>
  </section>

  <footer><span data-i18n="footer"></span></footer>
</div>

<script src="./assets/app.js"></script>
<script>
Object.assign(I18N.en, {
  m3Title:"Build the robo dog",
  m3Body:"Four SPIKE motors, four legs, a body that has to hold together while it walks."
});
Object.assign(I18N.de, {
  m3Title:"Den Robo-Hund bauen",
  m3Body:"Vier SPIKE-Motoren, vier Beine, ein Körper, der beim Laufen zusammenhalten muss."
});
Object.assign(I18N.it, {
  m3Title:"Costruire il robo-cane",
  m3Body:"Quattro motori SPIKE, quattro zampe, un corpo che deve reggere mentre cammina."
});
HL.init();
</script>
</body>
</html>
