(function () {
  var ON = ["bg-slate-800","text-emerald-400","border-emerald-500/40"];
  var OFF = ["text-slate-400","border-slate-700"];
  function apply(lang) {
    var d = I18N[lang] || I18N.en;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var v = d[el.getAttribute("data-i18n")];
      if (v) el.textContent = v;
    });
    document.querySelectorAll(".lang-btn").forEach(function (b) {
      var a = b.getAttribute("data-lang") === lang;
      ON.forEach(function (c) { b.classList.toggle(c, a); });
      OFF.forEach(function (c) { b.classList.toggle(c, !a); });
    });
    try { localStorage.setItem("hl-lang", lang); } catch (e) {}
  }
  document.querySelectorAll(".lang-btn").forEach(function (b) {
    b.addEventListener("click", function () { apply(b.getAttribute("data-lang")); });
  });
  var saved = null; try { saved = localStorage.getItem("hl-lang"); } catch (e) {}
  var nav = (navigator.language || "en").slice(0,2).toLowerCase();
  apply(saved || (I18N[nav] ? nav : "en"));
})();

/* Read-aloud. Word highlighting needs the `boundary` event, which iOS Safari
   does not fire; there we fall back to highlighting the whole block. */
(function () {
  var synth = window.speechSynthesis;
  if (!synth) { var b = document.getElementById("readAll"); if (b) b.parentElement.style.display = "none"; return; }
  var LANGMAP = { en:"en-GB", de:"de-DE", it:"it-IT" };
  var queue = [], qi = 0, current = null, wordSpans = [];

  function pickVoice(tag) {
    var vs = synth.getVoices() || [], two = tag.slice(0,2);
    return vs.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(two) === 0; })[0] || null;
  }
  function unwrap(el) {
    el.querySelectorAll("[data-tts-src]").forEach(function (n) {
      n.textContent = n.getAttribute("data-tts-src"); n.removeAttribute("data-tts-src");
    });
  }
  function wrapWords(el) {
    var spans = [], off = 0;
    el.querySelectorAll("h2,h3,p,li,span,div").forEach(function (n) {
      if (n.children.length) return;
      var t = n.textContent; if (!t || !t.trim()) return;
      n.setAttribute("data-tts-src", t);
      var html = "", re = /\S+\s*/g, m;
      while ((m = re.exec(t)) !== null) {
        html += '<span class="tts-word" data-s="' + (off + m.index) + '">' +
                m[0].replace(/&/g,"&amp;").replace(/</g,"&lt;") + "</span>";
      }
      n.innerHTML = html; off += t.length + 1;
      Array.prototype.push.apply(spans, n.querySelectorAll(".tts-word"));
    });
    return spans;
  }
  function textOf(el) {
    var out = [];
    el.querySelectorAll("h2,h3,p,li,span,div").forEach(function (n) {
      if (n.children.length) return;
      var t = n.textContent && n.textContent.trim(); if (t) out.push(t);
    });
    return out.join(". ");
  }
  function clearBtns() {
    document.querySelectorAll(".speak-btn.playing").forEach(function (b) {
      b.classList.remove("playing"); b.textContent = "\u25B6";
    });
  }
  function speak(el, btn, done) {
    var tag = LANGMAP[document.documentElement.lang] || "en-GB";
    var text = textOf(el); if (!text) { done && done(); return; }
    current = el; el.classList.add("tts-active"); wordSpans = wrapWords(el);
    var u = new SpeechSynthesisUtterance(text);
    u.lang = tag; var v = pickVoice(tag); if (v) u.voice = v;
    u.rate = document.getElementById("readSlow").checked ? 0.72 : 0.95;
    u.onboundary = function (e) {
      if (e.name && e.name !== "word") return;
      var i = e.charIndex || 0, best = null;
      for (var k = 0; k < wordSpans.length; k++) {
        if (+wordSpans[k].getAttribute("data-s") <= i) best = wordSpans[k]; else break;
      }
      wordSpans.forEach(function (s) { s.classList.remove("on"); });
      if (best) best.classList.add("on");
    };
    u.onend = function () {
      unwrap(el); el.classList.remove("tts-active");
      if (btn) { btn.classList.remove("playing"); btn.textContent = "\u25B6"; }
      done && done();
    };
    u.onerror = u.onend;
    if (btn) { btn.classList.add("playing"); btn.textContent = "\u25A0"; }
    el.scrollIntoView({ behavior:"smooth", block:"center" });
    synth.speak(u);
  }
  function stopAll() {
    queue = []; qi = 0; synth.cancel();
    if (current) { unwrap(current); current.classList.remove("tts-active"); }
    clearBtns(); current = null;
  }
  function run() { if (qi >= queue.length) { current = null; return; } speak(queue[qi++], null, run); }

  document.querySelectorAll(".readable").forEach(function (card) {
    var b = document.createElement("button");
    b.className = "speak-btn"; b.type = "button"; b.textContent = "\u25B6";
    b.setAttribute("aria-label", "Read aloud");
    b.addEventListener("click", function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      var was = b.classList.contains("playing");
      stopAll(); if (!was) speak(card, b, null);
    });
    card.appendChild(b);
  });
  document.getElementById("readAll").addEventListener("click", function () {
    stopAll(); queue = Array.prototype.slice.call(document.querySelectorAll(".readable")); qi = 0; run();
  });
  document.getElementById("readStop").addEventListener("click", stopAll);
  document.querySelectorAll(".lang-btn").forEach(function (b) { b.addEventListener("click", stopAll); });
  window.addEventListener("pagehide", stopAll);
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = function () { synth.getVoices(); };
})();
</script>

<script>
/* Text size control: children pick, choice persists. */
(function () {
  function set(s) {
    document.documentElement.setAttribute("data-size", s);
    document.querySelectorAll(".size-btn").forEach(function (b) {
      var a = b.getAttribute("data-size") === s;
      b.classList.toggle("border-emerald-500", a);
      b.classList.toggle("text-emerald-400", a);
      b.classList.toggle("border-slate-700", !a);
      b.classList.toggle("text-slate-300", !a);
    });
    try { localStorage.setItem("hl-size", s); } catch (e) {}
  }
  document.querySelectorAll(".size-btn").forEach(function (b) {
    b.addEventListener("click", function () { set(b.getAttribute("data-size")); });
  });
  var s = null; try { s = localStorage.getItem("hl-size"); } catch (e) {}
  set(s || "m");
})();
</script>
</body>
</html>
